<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>School Admission Form</title>
  <!-- Tailwind for form styling (optional) -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <!-- jsPDF library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
</head>
<body class="bg-gray-100 p-6">
  <div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-md">
    <h2 class="text-2xl font-bold mb-4">School Admission Form</h2>
    <form id="admissionForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Full Name</label>
        <input type="text" id="name" required class="mt-1 p-2 w-full border rounded-md" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Email Address</label>
        <input type="email" id="email" required class="mt-1 p-2 w-full border rounded-md" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Phone Number</label>
        <input type="tel" id="phone" required class="mt-1 p-2 w-full border rounded-md" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Date of Birth</label>
        <input type="date" id="dob" required class="mt-1 p-2 w-full border rounded-md" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Address</label>
        <textarea id="address" required class="mt-1 p-2 w-full border rounded-md"></textarea>
      </div>
      <button type="button" onclick="processForm()" class="bg-blue-600 text-white p-2 rounded-md">
        Submit &amp; Send via WhatsApp
      </button>
    </form>
  </div>

  <script>
    // Use jsPDF to generate the PDF
    async function generatePDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      // Retrieve form data
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const dob = document.getElementById('dob').value;
      const address = document.getElementById('address').value;

      // Apply styling in the PDF
      doc.setTextColor(34, 34, 34);  // Dark gray text
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(18);
      doc.text('School Admission Form', 20, 20);
      
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(12);
      doc.text(`Full Name: ${name}`, 20, 40);
      doc.text(`Email Address: ${email}`, 20, 50);
      doc.text(`Phone Number: ${phone}`, 20, 60);
      doc.text(`Date of Birth: ${dob}`, 20, 70);
      doc.text(`Address: ${address}`, 20, 80);

      // You can add more styling and layout adjustments here

      // Return the PDF as a Blob object so it can be sent to the server
      const pdfBlob = doc.output('blob');
      return pdfBlob;
    }

    // Function to handle form processing and sending the PDF
    async function processForm() {
      try {
        // Generate the PDF from the form
        const pdfBlob = await generatePDF();

        // Prepare the form data to send to the server
        const formData = new FormData();
        formData.append('pdfFile', pdfBlob, 'admission_form.pdf');
        formData.append('whatsappNumber', document.getElementById('phone').value); // or set a specific WhatsApp number

        // Send the PDF to your server
        const response = await fetch('/upload-and-send', { // make sure to update this URL to your server endpoint
          method: 'POST',
          body: formData
        });
        const result = await response.json();
        if (result.success) {
          alert('The PDF has been sent to the WhatsApp number!');
        } else {
          alert('There was an error sending the PDF.');
        }
      } catch (error) {
        console.error('Error processing the form:', error);
      }
    }
  </script>
</body>
</html>
